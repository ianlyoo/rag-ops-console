[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ops-console"
version = "0.1.0"
description = "Online RAG ops console - VectorDB (Chroma) + LangGraph + RAGAS + Sheets monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Youngin (Ian) Lyoo" }]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["rag*", "graph*", "eval*", "monitor*"]
